<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDEN · 剧情编辑页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #e8eaf2; color: #1c1e26; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; padding: 18px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .hint { font-size: 13px; color: #70748a; margin-bottom: 14px; line-height: 1.7; }
  .cols { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .col { background: #f4f5fb; border-radius: 14px; padding: 14px; }
  #nodelist { width: 250px; max-height: 60vh; overflow-y: auto; }
  #editor { flex: 1; min-width: 300px; }
  .nrow { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 4px; background: #e6e9f3; }
  .nrow.sel { outline: 2px solid #5f67e0; }
  .nrow .tag { float: right; font-size: 11px; color: #70748a; }
  label { display: block; font-size: 13px; color: #70748a; margin: 10px 0 3px; }
  input, textarea, select { width: 100%; font: inherit; font-size: 14px; padding: 8px; border: 1px solid #c3c7da; border-radius: 8px; background: #fff; }
  textarea { min-height: 70px; }
  button { font: inherit; font-size: 14px; border: none; border-radius: 8px; padding: 8px 14px; background: #5f67e0; color: #fff; cursor: pointer; margin: 4px 6px 0 0; }
  button.gray { background: #c3c7da; color: #1c1e26; }
  button.red { background: #b4432e; }
  .btnrow { margin-top: 12px; }
  #exportbox { margin-top: 16px; }
  #status { font-size: 13px; color: #1f9d5b; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
<h1>EDEN · 剧情编辑页</h1>
<p style="margin:-6px 0 10px"><a href="index.html" style="color:#1f9d5b;text-decoration:none">◂ 返回游戏</a></p>
<div class="hint">
  在这里改剧情、加节点，<b>不用写代码</b>。<br>
  改动只保存在<b>这台设备的浏览器</b>里（草稿本）；要变成手机上的正式版，请点「导出全部」，把 JSON 文本发给 AI 合并进 data.js 推仓库（出版印刷）。<br>
  选项写法：一行一个，<b>选项文字→目标节点id</b>（箭头用 → ）。
</div>

<div class="cols">
  <div id="nodelist" class="col"></div>
  <div id="editor" class="col">
    <label>节点 id（唯一，改不了就新建）</label>
    <input id="f_id" readonly>
    <label>说话人（大标题，可留空）</label>
    <input id="f_speaker">
    <label>正文（一行一段）</label>
    <textarea id="f_text" rows="7"></textarea>
    <label>选项（一行一个：文字→目标id；留空=用下面的"继续"）</label>
    <textarea id="f_choices" rows="4"></textarea>
    <label>无选项时接到的节点 id（可留空）</label>
    <input id="f_next">
    <label>进入本节点时：剩余天数（留空=不变）</label>
    <input id="f_days" placeholder="例如 32">
    <label>舱室状态（留空=不变）</label>
    <input id="f_status" placeholder="例如 正常运行">
    <label>获得物品（逗号分隔，需在下面物品表里有）</label>
    <input id="f_gain">
    <label>收入箱子的收藏品（逗号分隔，需在下面收藏品表里有）</label>
    <input id="f_unlock">
    <div class="btnrow">
      <button id="btn_save">保存这个节点</button>
      <button id="btn_new" class="gray">新建节点</button>
      <button id="btn_del" class="red">删除（仅自建节点）</button>
    </div>

    <h1 style="margin-top:22px">物品表</h1>
    <textarea id="f_items" rows="5" placeholder="一行一个：名字|图标|描述&#10;剩余时间协议|📜|全文74页，有效部分4行。"></textarea>
    <h1 style="margin-top:16px">收藏品表（获得后自动进游戏里的「箱子」页）</h1>
    <textarea id="f_collect" rows="5" placeholder="一行一个：名字|图标|描述"></textarea>
    <div class="btnrow"><button id="btn_save_tables" class="gray">保存物品/收藏表</button></div>
  </div>
</div>

<div id="exportbox" class="col" style="margin-top:16px">
  <button id="btn_export">导出全部</button>
  <button id="btn_copy" class="gray">复制到剪贴板</button>
  <button id="btn_import" class="gray">导入（读下面文本框）</button>
  <button id="btn_clear" class="red">清掉本机全部改动</button>
  <label>导出结果（把这段发给 AI）／导入时把 JSON 粘贴到这里：</label>
  <textarea id="f_export" rows="6"></textarea>
  <div id="status"></div>
</div>

<script src="data.js"></script>
<script src="dev.js"></script>
</body>
</html>
