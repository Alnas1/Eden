<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23273d">
<title>EDEN · 横幅互动区测试</title>
<style>
:root{
  --bg:#dfe2ec; --shell:#f4f5fb; --chip:#e6e9f3; --chip-press:#d7dbea;
  --text:#1c1e26; --dim:#70748a; --line:#c3c7da; --accent:#5f67e0; --ok:#3fae6a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
[hidden]{display:none!important}

/* ===== 顶部横幅：钉在屏幕顶部，恒定占 42% 屏高，图片铺满 ===== */
#stage{
  position:sticky; top:0; z-index:30;
  width:100%; height:clamp(230px,42vh,420px);
  overflow:hidden; background:#23273d;
  touch-action:none; cursor:pointer;
  box-shadow:0 6px 24px rgba(20,24,50,.28);
}
@media (min-width:600px){
  #stage{max-width:560px;margin:0 auto;border-radius:0 0 20px 20px}
}
#sky{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
/* 「太空舱 · 外部视野」浮在图片左上角 */
.tag{
  position:absolute;top:12px;left:12px;z-index:6;
  font-size:12.5px;letter-spacing:1.5px;color:#e8eaf2;
  background:rgba(10,12,20,.45);backdrop-filter:blur(6px);
  padding:5px 11px;border-radius:999px;pointer-events:none;
}
/* 热气球（复用正式版的视力表造型） */
#balloon{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  width:168px;z-index:3;pointer-events:none;
}
#balloon svg{display:block;width:100%;height:auto;overflow:visible}
.v-c #balloon{top:37%}

/* 底部提示（浮于图片上） */
#hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6;
  font-size:12.5px;color:rgba(232,234,242,.95);white-space:nowrap;
  background:rgba(10,12,20,.4);backdrop-filter:blur(4px);
  padding:4px 13px;border-radius:999px;pointer-events:none;
  transition:color .3s;
}
#stage.sharp #hint{color:#a8f0c4}
.v-c #hint{bottom:92px}

/* 数字按钮：直接出现在横幅内部，不用往下翻 */
#nums{
  position:absolute;left:0;right:0;bottom:46px;z-index:7;
  display:flex;justify-content:center;gap:12px;
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
}
#nums.show{opacity:1;transform:translateY(0);pointer-events:auto}
.v-c #nums{bottom:122px}
#nums button{
  min-width:76px;padding:12px 0;border:none;cursor:pointer;
  font-size:22px;font-weight:700;font-family:inherit;
  touch-action:manipulation;transition:transform .12s,opacity .3s;
}
#nums button:active{transform:scale(.94)}
#nums button.right{outline:3px solid var(--ok)}
#stage.done #nums button{opacity:.5;pointer-events:none}
#stage.done #nums button.right{opacity:1}
/* A 舷窗：毛玻璃圆角 */
.v-a #nums button{background:rgba(244,245,251,.9);backdrop-filter:blur(6px);color:#1c1e26;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* B 取景器：胶片条 */
.v-b #nums{background:rgba(8,10,18,.88);margin:0 14px;padding:12px 10px;border-radius:6px;
  background-image:repeating-linear-gradient(90deg,rgba(200,210,235,.35) 0 5px,transparent 5px 14px);
  background-size:100% 4px;background-position:0 3px,0 calc(100% - 3px);background-repeat:repeat-x}
.v-b #nums button{background:#141828;color:#d8e6ff;border:1px solid #3a4260;border-radius:4px;font-family:Consolas,Menlo,monospace}
/* C 旋钮：蚀刻金属牌 */
.v-c #nums button{background:#23273d;color:#cfd4ea;border:1px solid #4a5170;border-radius:8px}
/* D 擦雾：纸标签 */
.v-d #nums button{background:#f6f1e3;color:#4a3f2a;border-radius:6px;font-family:"KaiTi","STKaiti","楷体",serif;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.v-d #nums button:nth-child(1){transform:rotate(-1.5deg)}
.v-d #nums button:nth-child(3){transform:rotate(1.5deg)}

/* ===== A 舷窗：对焦进度环 ===== */
#ring{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;display:none;pointer-events:none}
.v-a #ring{display:block}
#ring circle{transition:stroke .3s}

/* ===== B 取景器：HUD ===== */
#hud{position:absolute;inset:0;z-index:5;display:none;pointer-events:none}
.v-b #hud{display:block}
#hud i{position:absolute;width:22px;height:22px;border:2px solid rgba(232,234,242,.85)}
#hud i:nth-child(1){top:10px;left:10px;border-right:none;border-bottom:none}
#hud i:nth-child(2){top:10px;right:10px;border-left:none;border-bottom:none}
#hud i:nth-child(3){bottom:10px;left:10px;border-right:none;border-top:none}
#hud i:nth-child(4){bottom:10px;right:10px;border-left:none;border-top:none}
#reticle{
  position:absolute;left:50%;top:44%;width:196px;height:196px;
  transform:translate(-50%,-50%) scale(1.25);
  border:1.5px solid rgba(232,234,242,.75);border-radius:50%;
  transition:border-color .3s;
}
#reticle::before,#reticle::after{content:"";position:absolute;background:rgba(232,234,242,.75)}
#reticle::before{left:50%;top:-14px;bottom:-14px;width:1.5px;transform:translateX(-50%)}
#reticle::after{top:50%;left:-14px;right:-14px;height:1.5px;transform:translateY(-50%)}
#stage.sharp #reticle{border-color:#7fe0a0}
#stage.sharp #reticle::before,#stage.sharp #reticle::after{background:#7fe0a0}
#hudread{
  position:absolute;top:12px;right:12px;
  font-family:Consolas,Menlo,monospace;font-size:12px;letter-spacing:1px;
  color:#cfe3ff;background:rgba(8,10,18,.55);padding:4px 9px;border-radius:6px;
}
#stage.sharp #hudread{color:#7fe0a0}
#scan{position:absolute;left:0;right:0;top:0;height:2px;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(127,224,160,.55),transparent)}
#stage.focusing #scan{opacity:1;animation:sweep 1.5s linear infinite}
@keyframes sweep{from{top:8%}to{top:92%}}

/* ===== C 镜头旋钮 ===== */
#dial{position:absolute;left:0;right:0;bottom:0;z-index:6;display:none;padding:26px 16px 12px;
  background:linear-gradient(180deg,rgba(15,17,28,0),rgba(15,17,28,.9) 45%)}
.v-c #dial{display:block}
#dtrack{position:relative;height:46px;background:#1d2133;border:1px solid #3a4260;border-radius:10px;
  touch-action:none;cursor:grab;overflow:hidden;
  background-image:repeating-linear-gradient(90deg,rgba(207,212,234,.22) 0 1px,transparent 1px 5%)}
#dtrack:active{cursor:grabbing}
#dzone{position:absolute;top:0;bottom:0;background:rgba(80,200,120,.26);
  border-left:1px solid rgba(80,200,120,.75);border-right:1px solid rgba(80,200,120,.75)}
#dknob{position:absolute;top:3px;bottom:3px;width:30px;left:-15px;
  background:linear-gradient(180deg,#6a72e8,#4a51c0);border-radius:7px;
  box-shadow:0 2px 8px rgba(0,0,0,.45)}
#dknob::after{content:"";position:absolute;left:8px;right:8px;top:10px;bottom:10px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 2px,transparent 2px 6px)}
#stage.sharp #dknob{background:linear-gradient(180deg,#4cc97e,#2f9e5c)}
#dialcap{text-align:center;font-size:11px;color:rgba(207,212,234,.7);letter-spacing:2px;margin-top:6px}

/* ===== D 擦雾 ===== */
#fog{position:absolute;inset:0;width:100%;height:100%;z-index:5;display:none;touch-action:none;transition:opacity .7s ease}
.v-d #fog{display:block}
#dread{position:absolute;top:12px;right:12px;z-index:6;display:none;
  font-size:12px;letter-spacing:1px;color:#e8eaf2;background:rgba(10,12,20,.45);
  padding:4px 9px;border-radius:6px;pointer-events:none}
.v-d #dread{display:block}

/* ===== 横幅下方：方案切换 + 剧情 + 结果 ===== */
#below{max-width:560px;margin:0 auto;padding:14px 16px calc(44px + env(safe-area-inset-bottom))}
.switcher{display:flex;gap:8px}
.switcher button{
  flex:1;padding:11px 0;border:none;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;color:var(--dim);
  background:var(--chip);touch-action:manipulation;
}
.switcher button.active{background:var(--accent);color:#fff}
.switcher button:active{background:var(--chip-press)}
.switcher button.active:active{background:var(--accent)}
#vdesc{font-size:13px;color:var(--dim);line-height:1.7;margin:10px 2px 14px}
.story{background:var(--shell);border-radius:16px;padding:16px 18px;box-shadow:0 2px 10px rgba(40,44,80,.08)}
.story h2{font-size:19px;font-weight:800;margin-bottom:8px}
.story p{font-size:16px;line-height:1.75;margin-bottom:6px}
.story p.sys{color:var(--dim)}
#verdict{margin:14px 2px;font-size:15.5px;line-height:1.7;min-height:26px}
#verdict.ok{color:#2c7a4b}
#verdict.no{color:#b0484d}
#replay{
  display:block;width:100%;margin-top:6px;padding:14px;border:none;border-radius:12px;cursor:pointer;
  font-family:"KaiTi","STKaiti","楷体",serif;font-size:18px;
  background:var(--chip);color:var(--text);touch-action:manipulation;
}
#replay:active{background:var(--chip-press)}
.note{font-size:12.5px;color:var(--dim);line-height:1.8;margin-top:16px}
</style>
</head>
<body>

<!-- 顶部横幅 = 主互动区：图片铺满、标题浮于图上、数字按钮在横幅内 -->
<div id="stage" class="v-a">
  <img id="sky" src="space.svg" alt="" draggable="false">
  <div class="tag">太空舱 · 外部视野</div>

  <div id="balloon">
    <svg viewBox="0 0 130 150">
      <g id="fg">
        <circle cx="65" cy="55" r="46" fill="#eef0f8" stroke="#9aa0c8" stroke-width="2.5"/>
        <path d="M25 46 Q65 10 105 46" stroke="#5f67e0" stroke-width="3" fill="none" opacity=".7"/>
        <path d="M42 20 Q65 8 88 20" stroke="#c3c7da" stroke-width="2" fill="none"/>
        <text id="bnum" x="65" y="72" text-anchor="middle" font-size="34" font-weight="700" fill="#1c1e26">00</text>
        <line x1="47" y1="98" x2="56" y2="118" stroke="#9aa0c8" stroke-width="2"/>
        <line x1="83" y1="98" x2="74" y2="118" stroke="#9aa0c8" stroke-width="2"/>
        <rect x="53" y="118" width="24" height="16" rx="3" fill="#b79a6a" stroke="#8a6f4d" stroke-width="2"/>
      </g>
    </svg>
  </div>

  <!-- A：进度环 -->
  <svg id="ring" width="230" height="230" viewBox="0 0 230 230">
    <circle id="ringc" cx="115" cy="115" r="104" fill="none" stroke="#5f67e0" stroke-width="3"
      stroke-linecap="round" stroke-dasharray="653.45" stroke-dashoffset="653.45" transform="rotate(-90 115 115)"/>
  </svg>

  <!-- B：取景器 HUD -->
  <div id="hud">
    <i></i><i></i><i></i><i></i>
    <div id="reticle"></div>
    <div id="hudread">FOCUS 000%</div>
    <div id="scan"></div>
  </div>

  <!-- C：镜头旋钮 -->
  <div id="dial">
    <div id="dtrack">
      <div id="dzone"></div>
      <div id="dknob"></div>
    </div>
    <div id="dialcap">FOCUS · 拧到绿色区</div>
  </div>

  <!-- D：雾层画布 -->
  <canvas id="fog"></canvas>
  <div id="dread">雾 100%</div>

  <div id="nums"></div>
  <div id="hint">按住画面任意处 · 把它拧到清晰</div>
</div>

<div id="below">
  <div class="switcher" id="switcher">
    <button data-v="a" class="active">A 舷窗</button>
    <button data-v="b">B 取景器</button>
    <button data-v="c">C 旋钮</button>
    <button data-v="d">D 擦雾</button>
  </div>
  <div id="vdesc"></div>

  <div class="story">
    <h2>？？？</h2>
    <p>请您目视前方。是的，很好，聚焦，等您能看清楚了，再告知我屏幕上的数字。</p>
    <p class="sys">视野画面亮起：远处浮着一只热气球，吊篮上印着一个数字。</p>
    <p class="sys">现在它糊成一团，像隔着一层没擦干的眼泪。</p>
  </div>

  <div id="verdict"></div>
  <button id="replay">再玩一次（换个数字）</button>
  <div class="note">
    这是独立的测试页，不影响正式游戏。往下滚动试试——横幅始终钉在顶部。<br>
    四个方案都已关掉「长按弹复制」：整个横幅禁止选中文字、禁止系统长按菜单。<br>
    选定方案后，AI 会把它合回正式版的开场。
  </div>
</div>

<script>
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var fg = document.getElementById('fg');
  var bnum = document.getElementById('bnum');
  var numsEl = document.getElementById('nums');
  var hintEl = document.getElementById('hint');
  var verdictEl = document.getElementById('verdict');
  var vdescEl = document.getElementById('vdesc');
  var ringc = document.getElementById('ringc');
  var reticle = document.getElementById('reticle');
  var hudread = document.getElementById('hudread');
  var dtrack = document.getElementById('dtrack');
  var dzone = document.getElementById('dzone');
  var dknob = document.getElementById('dknob');
  var fog = document.getElementById('fog');
  var dread = document.getElementById('dread');

  var RING_LEN = 653.45;
  var current = 'a';
  var quiz = 0, sharp = false, sharpHook = null;
  var cleanupFns = [];

  var DESC = {
    a: 'A 舷窗：最接近现在的样子。按住图片任意位置逐渐变清晰，中心有进度环；看清后数字从图片底部浮出。',
    b: 'B 取景器：相机取景器风格——角标、十字线、实时对焦百分比，锁定后数字以胶片条排列。仪器感最强。',
    c: 'C 旋钮：不用长按。拖动底部镜头旋钮左右「拧」，拧进绿色清晰区才能读数。彻底绕开长按复制问题。',
    d: 'D 擦雾（出格）：舷窗结了一层雾，用手指像擦玻璃一样把雾擦掉，热气球和数字逐渐显露。整块横幅是一面可以擦的窗。'
  };
  var HINT = {
    a: '按住画面任意处 · 把它拧到清晰',
    b: '按住画面 · 对焦锁定后报数',
    c: '左右拖动下方旋钮 · 拧进绿色区',
    d: '用手指擦掉舷窗上的雾'
  };
  var SHARP_HINT = {
    a: '看清了 · 点数字报给伊甸',
    b: '对焦锁定 · 点数字报给伊甸',
    c: '拧到位了 · 点数字报给伊甸',
    d: '雾擦净了 · 点数字报给伊甸'
  };

  function on(el, ev, fn, opt) {
    el.addEventListener(ev, fn, opt);
    cleanupFns.push(function () { el.removeEventListener(ev, fn, opt); });
  }
  function cleanup() { cleanupFns.forEach(function (f) { f(); }); cleanupFns = []; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---- 回合 ---- */
  function newRound() {
    cleanup();
    sharp = false; sharpHook = null;
    quiz = 10 + Math.floor(Math.random() * 90);
    bnum.textContent = quiz;
    numsEl.innerHTML = ''; numsEl.classList.remove('show');
    stage.classList.remove('done', 'sharp', 'focusing');
    verdictEl.textContent = ''; verdictEl.className = '';
    hintEl.textContent = HINT[current];
    SETUP[current]();
  }

  function reveal() {
    if (sharp) return;
    sharp = true;
    stage.classList.add('sharp');
    stage.classList.remove('focusing');
    fg.style.filter = 'none';
    hintEl.textContent = SHARP_HINT[current];
    var set = [quiz];
    while (set.length < 3) {
      var r = 10 + Math.floor(Math.random() * 90);
      if (set.indexOf(r) < 0) set.push(r);
    }
    set.sort(function () { return Math.random() - 0.5; });
    set.forEach(function (n) {
      var b = document.createElement('button');
      b.textContent = n;
      b.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      b.addEventListener('click', function () { answer(n, b); });
      numsEl.appendChild(b);
    });
    numsEl.classList.add('show');
    if (sharpHook) sharpHook();
  }

  function answer(n, btn) {
    if (!sharp || stage.classList.contains('done')) return;
    if (n === quiz) {
      stage.classList.add('done');
      btn.classList.add('right');
      hintEl.textContent = '已上报 ✓ 视力正常';
      verdictEl.className = 'ok';
      verdictEl.textContent = '伊甸：很高兴您的视力并无异常。接下来，请向我复诵您的姓名、性别、年龄。';
    } else {
      newRound();
      verdictEl.className = 'no';
      verdictEl.textContent = '伊甸：请再仔细看看。（数字换了，再拧一次）';
    }
  }

  /* ---- A / B 共用：按住渐清晰 ---- */
  function holdFocus(onProgress) {
    var p = 0, timer = null;
    function stop() {
      if (timer) { clearInterval(timer); timer = null; }
      stage.classList.remove('focusing');
    }
    on(stage, 'pointerdown', function (e) {
      if (sharp || e.target.closest('#nums')) return;
      e.preventDefault();
      stop();
      stage.classList.add('focusing');
      timer = setInterval(function () {
        p = Math.min(1, p + 0.075);
        onProgress(p);
        if (p >= 1) { stop(); reveal(); }
        else if (p > 0.08) { hintEl.textContent = '再按住一会儿…'; }
      }, 70);
    });
    on(window, 'pointerup', stop);
    on(window, 'pointercancel', stop);
  }

  /* ---- A 舷窗 ---- */
  function setupA() {
    fg.style.filter = 'blur(14px)';
    ringc.style.stroke = '#5f67e0';
    ringc.style.strokeDashoffset = RING_LEN;
    holdFocus(function (p) {
      fg.style.filter = 'blur(' + (14 * (1 - p)).toFixed(2) + 'px)';
      ringc.style.strokeDashoffset = RING_LEN * (1 - p);
    });
    sharpHook = function () { ringc.style.stroke = '#3fae6a'; ringc.style.strokeDashoffset = 0; };
  }

  /* ---- B 取景器 ---- */
  function setupB() {
    fg.style.filter = 'blur(14px) saturate(.55)';
    hudread.textContent = 'FOCUS 000%';
    reticle.style.transform = 'translate(-50%,-50%) scale(1.25)';
    holdFocus(function (p) {
      fg.style.filter = 'blur(' + (14 * (1 - p)).toFixed(2) + 'px) saturate(' + (0.55 + 0.45 * p).toFixed(2) + ')';
      hudread.textContent = 'FOCUS ' + String(Math.round(p * 100)).padStart(3, '0') + '%';
      reticle.style.transform = 'translate(-50%,-50%) scale(' + (1.25 - 0.25 * p).toFixed(3) + ')';
    });
    sharpHook = function () {
      hudread.textContent = 'LOCK ✓';
      reticle.style.transform = 'translate(-50%,-50%) scale(1)';
    };
  }

  /* ---- C 镜头旋钮 ---- */
  function setupC() {
    var zoneStart = rnd(50, 78), zoneW = 12;
    var p = 0, dragging = false;
    dzone.style.left = zoneStart + '%';
    dzone.style.width = zoneW + '%';
    dknob.style.left = 'calc(0% - 15px)';
    fg.style.filter = 'blur(14px)';

    function dist() {
      if (p >= zoneStart && p <= zoneStart + zoneW) return 0;
      return p < zoneStart ? zoneStart - p : p - (zoneStart + zoneW);
    }
    function apply() {
      dknob.style.left = 'calc(' + p + '% - 15px)';
      var d = dist();
      if (!sharp) {
        fg.style.filter = d === 0 ? 'none' : 'blur(' + Math.min(14, d * 0.5).toFixed(2) + 'px)';
        if (d === 0) reveal();
      }
    }
    function move(e) {
      var rect = dtrack.getBoundingClientRect();
      p = clamp((e.clientX - rect.left) / rect.width * 100, 0, 100);
      apply();
    }
    on(dtrack, 'pointerdown', function (e) {
      if (sharp) return;
      e.preventDefault(); e.stopPropagation();
      dragging = true;
      try { dtrack.setPointerCapture(e.pointerId); } catch (err) {}
      move(e);
    });
    on(dtrack, 'pointermove', function (e) { if (dragging && !sharp) move(e); });
    on(dtrack, 'pointerup', function () { dragging = false; });
    on(dtrack, 'pointercancel', function () { dragging = false; });
    sharpHook = function () { dragging = false; };
    apply();
  }

  /* ---- D 擦雾 ---- */
  function setupD() {
    var W = stage.clientWidth, H = stage.clientHeight;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    fog.width = Math.max(1, Math.round(W * dpr));
    fog.height = Math.max(1, Math.round(H * dpr));
    fog.style.opacity = ''; fog.style.pointerEvents = '';
    var ctx = fog.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    /* 画雾：浅灰底 + 噪点 + 水痕 */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(221,226,238,.95)';
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < 420; i++) {
      ctx.fillStyle = 'rgba(120,128,158,' + rnd(0.03, 0.1).toFixed(3) + ')';
      ctx.fillRect(rnd(0, W), rnd(0, H), rnd(1, 3), rnd(1, 3));
    }
    for (var s = 0; s < 9; s++) {
      var x0 = rnd(0, W);
      ctx.strokeStyle = 'rgba(245,247,252,' + rnd(0.2, 0.4).toFixed(2) + ')';
      ctx.lineWidth = rnd(2, 5);
      ctx.beginPath();
      ctx.moveTo(x0, rnd(-10, H * 0.3));
      ctx.bezierCurveTo(x0 + rnd(-20, 20), H * 0.4, x0 + rnd(-25, 25), H * 0.7, x0 + rnd(-15, 15), H + 10);
      ctx.stroke();
    }

    fg.style.filter = 'blur(2.5px)';
    dread.textContent = '雾 100%';

    /* 擦除：destination-out 软边圆 + 粗网格记进度 */
    var CELL = 26, cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL);
    var grid = new Uint8Array(cols * rows), wiped = 0, total = cols * rows;
    var active = false, last = null, revealed = false;
    var R = 30;

    function stamp(x, y) {
      var g = ctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.7, 'rgba(0,0,0,.9)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
      var c0 = Math.max(0, Math.floor((x - R) / CELL)), c1 = Math.min(cols - 1, Math.floor((x + R) / CELL));
      var r0 = Math.max(0, Math.floor((y - R) / CELL)), r1 = Math.min(rows - 1, Math.floor((y + R) / CELL));
      for (var rr = r0; rr <= r1; rr++) for (var cc = c0; cc <= c1; cc++) {
        var idx = rr * cols + cc;
        if (grid[idx]) continue;
        var cx = cc * CELL + CELL / 2, cy = rr * CELL + CELL / 2;
        if ((cx - x) * (cx - x) + (cy - y) * (cy - y) < R * R) { grid[idx] = 1; wiped++; }
      }
    }
    function wipeTo(x, y) {
      if (last) {
        var dx = x - last.x, dy = y - last.y, d = Math.sqrt(dx * dx + dy * dy);
        var steps = Math.max(1, Math.ceil(d / 7));
        for (var k = 1; k <= steps; k++) stamp(last.x + dx * k / steps, last.y + dy * k / steps);
      } else stamp(x, y);
      last = { x: x, y: y };
      var pct = wiped / total;
      dread.textContent = '已擦 ' + Math.round(pct * 100) + '%';
      if (!revealed && pct >= 0.55) {
        revealed = true;
        fog.style.opacity = '0'; fog.style.pointerEvents = 'none';
        dread.textContent = '已擦净 ✓';
        reveal();
      }
    }
    function pos(e) {
      var rect = fog.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    on(fog, 'pointerdown', function (e) {
      if (revealed) return;
      e.preventDefault();
      active = true; last = null;
      try { fog.setPointerCapture(e.pointerId); } catch (err) {}
      var pt = pos(e); wipeTo(pt.x, pt.y);
    });
    on(fog, 'pointermove', function (e) {
      if (!active || revealed) return;
      var pt = pos(e); wipeTo(pt.x, pt.y);
    });
    on(window, 'pointerup', function () { active = false; last = null; });
    on(window, 'pointercancel', function () { active = false; last = null; });
    sharpHook = function () {
      if (!revealed) {
        revealed = true;
        fog.style.opacity = '0'; fog.style.pointerEvents = 'none';
        dread.textContent = '已擦净 ✓';
      }
    };
  }

  var SETUP = { a: setupA, b: setupB, c: setupC, d: setupD };

  function switchVariant(k) {
    current = k;
    stage.className = 'v-' + k;
    Array.prototype.forEach.call(document.querySelectorAll('#switcher button'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-v') === k);
    });
    vdescEl.textContent = DESC[k];
    newRound();
  }

  Array.prototype.forEach.call(document.querySelectorAll('#switcher button'), function (b) {
    b.addEventListener('click', function () { switchVariant(b.getAttribute('data-v')); });
  });
  document.getElementById('replay').addEventListener('click', function () { newRound(); });

  /* 全页禁选中、禁长按菜单——治「点按唤出复制」 */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });

  switchVariant('a');
})();
</script>
</body>
</html>
