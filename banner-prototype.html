<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8eaf2">
<title>EDEN · 横幅原型（全页面·第一章）</title>
<style>
/* ===== EDEN 原型 · 浅色卡片美学 · 顶部横幅恒定互动版 ===== */
:root {
  --bg: #dfe2ec; --shell: #f4f5fb; --card: #dfe2ee;
  --chip: #e6e9f3; --chip-press: #d7dbea;
  --text: #1c1e26; --dim: #70748a; --line: #c3c7da; --accent: #5f67e0; --ok: #3fae6a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select:none; -webkit-touch-callout: none;
  transition: background-color .5s ease;
  overflow: hidden;
}
[hidden] { display: none !important; }

#app {
  max-width: 560px; margin: 0 auto; height: 100dvh;
  background: var(--shell); display: flex; flex-direction: column;
  box-shadow: 0 0 40px rgba(40,44,80,.14);
}
@media (min-width:600px){ #app { border-radius: 26px; margin: 14px auto; height: calc(100dvh - 28px); } }

/* ===== 顶部横幅：恒定占据约 40% 屏高，任何页签都不动它 ===== */
#stage {
  position: relative; flex: none;
  height: clamp(210px, 40vh, 400px);
  overflow: hidden; background: #23273d;
  touch-action: none; cursor: pointer;
}
@media (min-width:600px){ #stage { border-radius: 26px 26px 0 0; } }
#vpimg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.tag {
  position:absolute; top:12px; left:12px; z-index:6;
  font-size:12.5px; letter-spacing:1.5px; color:#e8eaf2;
  background:rgba(10,12,20,.45); backdrop-filter:blur(6px);
  padding:5px 11px; border-radius:999px; pointer-events:none;
}
#podchip {
  position:absolute; top:12px; right:12px; z-index:6;
  font-size:11.5px; color:#e8eaf2;
  background:rgba(10,12,20,.45); backdrop-filter:blur(6px);
  padding:5px 10px; border-radius:999px; pointer-events:none;
  max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* 对焦小游戏（方案A 舷窗：按住画面 → 进度环 → 数字浮出） */
#focuspad { position:absolute; inset:0; z-index:4; display:none; }
#focuspad.on { display:block; }
#balloon { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); width:168px; pointer-events:none; }
#balloon svg { display:block; width:100%; height:auto; overflow:visible; }
#ring { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); pointer-events:none; }
#ring circle { transition: stroke .3s; }
#hint {
  position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:7;
  font-size:12.5px; color:rgba(232,234,242,.95); white-space:nowrap;
  background:rgba(10,12,20,.4); backdrop-filter:blur(4px);
  padding:4px 13px; border-radius:999px; pointer-events:none; transition: color .3s;
}
#stage.sharp #hint { color:#a8f0c4; }
#nums {
  position:absolute; left:0; right:0; bottom:48px; z-index:8;
  display:flex; justify-content:center; gap:12px;
  opacity:0; transform:translateY(14px); pointer-events:none;
  transition: opacity .3s ease, transform .3s ease;
}
#nums.show { opacity:1; transform:translateY(0); pointer-events:auto; }
#nums button {
  min-width:76px; padding:12px 0; border:none; cursor:pointer;
  font-size:22px; font-weight:700; font-family:inherit;
  background:rgba(244,245,251,.92); backdrop-filter:blur(6px); color:#1c1e26;
  border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,.25);
  touch-action:manipulation; transition: transform .12s, opacity .3s;
}
#nums button:active { transform: scale(.94); }
#nums button.right { outline:3px solid var(--ok); }
#stage.done #nums button { opacity:.5; pointer-events:none; }
#stage.done #nums button.right { opacity:1; }

/* ===== 页签行 ===== */
.tabbar {
  flex:none; display:flex; justify-content:space-between; align-items:center;
  padding:6px 14px 2px; background:var(--shell); border-bottom:1px solid #e2e5f0;
  transition: background-color .5s ease;
}
.tab { background:none; border:none; cursor:pointer; font-family:inherit; font-size:15px; color:var(--dim); padding:8px 10px; border-radius:8px; touch-action:manipulation; }
.tab.active { color:var(--text); font-weight:700; }
.tabtools { display:flex; align-items:center; gap:2px; margin-left:auto; }
.tbtn { background:none; border:none; cursor:pointer; font-family:inherit; font-size:14px; color:var(--dim); padding:8px; border-radius:8px; touch-action:manipulation; }
.tbtn:active { background:var(--chip-press); }

/* ===== 正文滚动区 ===== */
#view { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 18px calc(30px + env(safe-area-inset-bottom)); }

.block { margin-bottom:18px; user-select:text; }
.block.enter { animation: fadein .35s ease; }
@keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; } }
.block h2 { font-size:22px; font-weight:800; margin-bottom:8px; }
.block p { font-size:16.5px; line-height:1.75; margin-bottom:6px; }
.block .sys { color:var(--dim); }
.gain { font-size:15px; margin-top:10px; }
.gain b { color:var(--accent); }
.choice-list { display:flex; flex-direction:column; gap:12px; margin-top:18px; }
.btn {
  font-family:"KaiTi","STKaiti","楷体","FZKai-Z03S",serif;
  background:var(--chip); color:var(--text); border:none; border-radius:12px;
  padding:14px 18px; font-size:18px; cursor:pointer; text-align:left; touch-action:manipulation;
}
.btn:active { background:var(--chip-press); }
.btn.plain { font-family:inherit; font-size:16px; text-align:center; color:var(--dim); }
.row { background:var(--chip); border-radius:14px; padding:14px 16px; margin-bottom:12px; display:flex; flex-direction:column; gap:5px; }
.row b { font-size:15.5px; }
.row .desc { font-size:14px; color:var(--dim); line-height:1.6; }
.row.locked { opacity:.45; }
.row.here { outline:2px solid var(--accent); }
.movebtn { align-self:flex-start; cursor:pointer; font-family:inherit; background:none; border:1px solid var(--line); border-radius:8px; color:var(--dim); font-size:13px; padding:5px 12px; margin-top:3px; touch-action:manipulation; }
.movebtn:active { background:var(--chip-press); }
.countdown { font-size:40px; text-align:center; font-weight:700; letter-spacing:2px; margin:22px 0 6px; color:var(--accent); }
.countdown-label { text-align:center; color:var(--dim); font-size:14px; margin-bottom:22px; }
.quote { margin:12px 0; padding:14px 16px; background:var(--chip); border-radius:12px; font-size:14.5px; line-height:1.8; color:#3a3e50; }
.note { font-size:13px; color:var(--dim); margin-top:14px; line-height:1.7; }
.empty { color:var(--dim); font-size:15px; text-align:center; margin-top:40px; }
.endcard { text-align:center; margin-top:26px; color:var(--dim); font-size:15px; line-height:2; }
.endcard b { color:var(--text); font-size:17px; }

/* ===== 复诵弹窗 ===== */
body.locked { overflow:hidden; }
#ask { position:fixed; inset:0; z-index:30; background:rgba(223,226,238,.92); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; padding:20px; }
.cu { width:100%; max-width:420px; background:var(--shell); border-radius:20px; padding:26px 24px 24px; box-shadow:0 12px 40px rgba(40,44,80,.18); display:flex; flex-direction:column; gap:12px; }
.cu-k { color:var(--dim); font-size:12.5px; letter-spacing:2px; }
.cu h2 { font-size:20px; font-weight:800; line-height:1.4; }
.cu-note { color:var(--dim); font-size:13px; }
#ask input { font-family:inherit; font-size:17px; color:var(--text); background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:13px 16px; outline:none; user-select:text; }
#ask input:focus { border-color:var(--accent); }
#aerr { color:#b0484d; font-size:13.5px; min-height:18px; }
#ask .btn { text-align:center; margin-top:4px; }

/* ===== 黑场开场 ===== */
#intro { position:fixed; inset:0; z-index:50; background:#05060c; display:flex; align-items:center; justify-content:center; opacity:1; transition:opacity .7s ease; }
#intro.out { opacity:0; }
.ititle { font-family:"KaiTi","STKaiti","楷体",serif; font-size:min(30vw,150px); color:#e8eaf2; letter-spacing:.18em; opacity:0; transform:scale(1.12); transition:opacity 1.6s ease, transform 2.4s ease; }
.ititle.on { opacity:1; transform:scale(1); }
</style>
</head>

<div id="intro" hidden>

(function () {

  var actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  document.addEventListener('pointerdown', function once() { audio(); document.removeEventListener('pointerdown', once); });
  function tone(f, d, type, at) {
    var ac = audio(); if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (at || 0);
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.012);

    var age = Math.floor(Math.random() * tot), acc = 0, phase = order[0], left = tot;

    }
    return { name: name, rate: rate, phase: phase, left: left, age: age, spent: 0, charged: 0 };

    if (typeof node.add === 'number') s.day = Math.max(0, s.day + node.add);
    if (node.status) s.status = node.status;
    if (node.enter && D.worlds && D.worlds[node.enter]) { s.slice = newSlice(node.enter); s.world = node.enter; }
    if (node.world) s.world = node.world;
    if (typeof node.stay === 'number') {
      if (s.slice) {
        var ch = Math.max(1, Math.round(node.stay / s.slice.rate));
        s.slice.spent = (s.slice.spent || 0) + node.stay;
        s.slice.charged = (s.slice.charged || 0) + ch;
        s.day = Math.max(0, s.day - ch);
      } else {
        s.day = Math.max(0, s.day - node.stay);
      }
    }
    (node.gain || []).forEach(function (i) { if (s.items.indexOf(i) < 0) s.items.push(i); });
    (node.unlock || []).forEach(function (c) { if (s.collect.indexOf(c) < 0) s.collect.push(c); });
    Object.keys(node.flags || {}).forEach(function (k) { s.flags[k] = node.flags[k]; });
  }

  var state = loadState();
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
  save();

  function sub(text) {
    var s = String(text).replace(/\?\?\?/g, state.pod);
    s = s.replace(/\{名字\}/g, state.char ? state.char.name : '???');
    s = s.replace(/\{性别\}/g, state.char ? state.char.sex : '???');
    s = s.replace(/\{年限\}/g, state.years || '???');
    s = s.replace(/\{余额\}/g, state.day);
    if (state.slice) {
      s = s.replace(/\{停留\}/g, state.slice.spent);
      s = s.replace(/\{扣减\}/g, state.slice.charged);
      s = s.replace(/\{相位\}/g, state.slice.phase);
    }
    return s;
  }

  function needOk(need) {
    if (!need) return true;
    var p = String(need).split('=');
    var v = state.flags[p[0]];
    return p.length > 1 ? String(v) === p[1] : !!v;
  }

  var $view = document.getElementById('view');
  var $tabs = document.getElementById('tabbar');
  var TABS = [
    { id: 'log', label: 'log' },
    { id: 'map', label: '地图' },
    { id: 'hour', label: '沙漏' },
    { id: 'bag', label: '背包' },
    { id: 'box', label: '箱子' }
  ];

  function renderTabs() {
    var tools = $tabs.querySelector('.tabtools');
    Array.prototype.slice.call($tabs.querySelectorAll('.tab')).forEach(function (x) { $tabs.removeChild(x); });
    TABS.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'tab' + (state.tab === t.id ? ' active' : '');
      b.textContent = t.label;
      b.onclick = function () { state.tab = t.id; save(); render(); };
      $tabs.insertBefore(b, tools);
    });
  }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function blockNode(node, enter) {
    var box = el('div', 'block' + (enter ? ' enter' : ''));
    if (node.speaker) box.appendChild(el('h2', null, esc(sub(node.speaker))));
    (node.text || []).forEach(function (p) {
      var isSys = /^[【—（哔滴]|摘要/.test(p);
      box.appendChild(el('p', isSys ? 'sys' : null, esc(sub(p))));
    });
    (node.gain || []).forEach(function (i) {
      box.appendChild(el('div', 'gain', '获得 <b>' + esc(sub(i)) + '</b>'));
    });
    return box;
  }

  /* ---- 尾部按钮 / 对焦卡 ---- */
  var tailEl = null, focusOn = false;

  function renderTail() {
    if (tailEl && tailEl.parentNode) tailEl.parentNode.removeChild(tailEl);
    tailEl = el('div', 'choice-list');
    var cur = D.nodes[state.node];

    if (cur && cur.focus) {
      renderFocus(cur);
      $view.appendChild(tailEl);   /* 数字按钮在横幅内，正文尾部不放东西 */
      return;
    }
    stopFocus();
    if (cur && cur.end) {
      tailEl.appendChild(el('div', 'endcard',
        '<b>' + esc(cur.endnote || '第一章 · 完') + '</b><br>倒计时已经开始了，' + esc(state.pod) + ' 号。<br>' +
        '（原型试读版：后面的章节没有写入这份 HTML）'));
      var again = el('button', 'btn plain', '重新开始（清掉存档）');
      again.onclick = reset;
      tailEl.appendChild(again);
    } else if (cur && cur.ask) {
      if (!state.char) {
        var b0 = el('button', 'btn', '（开口复诵）');
        b0.onclick = openAsk;
        tailEl.appendChild(b0);
      } else if (cur.next) {
        var b1 = el('button', 'btn plain', '继 续');
        b1.onclick = function () { go(cur.next); };
        tailEl.appendChild(b1);
      }
    } else if (cur && cur.choices && cur.choices.length) {
      var shown = cur.choices.filter(function (c) { return needOk(c.need); });
      shown.forEach(function (c) {
        var b = el('button', 'btn', esc(sub(c.t)));
        b.onclick = function () { go(c.to); };
        tailEl.appendChild(b);
      });
      if (!shown.length) {
        var w = el('button', 'btn plain', '继 续');
        w.onclick = function () { go(cur.next || state.node); };
        tailEl.appendChild(w);
      }
    } else if (cur && cur.next) {
      var cont = el('button', 'btn plain', '继 续');
      cont.onclick = function () { go(cur.next); };
      tailEl.appendChild(cont);
    } else {
      var back = el('button', 'btn plain', '回到 log');
      back.onclick = function () { state.tab = 'log'; save(); render(); };
      tailEl.appendChild(back);
    }
    $view.appendChild(tailEl);
  }

  /* ---- 对焦小游戏 · 方案A（按住横幅 → 进度环 → 数字在横幅内浮出）---- */
  var RING_LEN = 653.45;
  var focusCleanup = null;
  function renderFocus(cur) {
    var stage = document.getElementById('stage');
    if (focusCleanup) { focusCleanup(); focusCleanup = null; }
    /* 重建 pad 节点：清掉上一次遗留的 pointer 监听，防叠加 */
    var old = document.getElementById('focuspad');
    var pad = old.cloneNode(true);
    old.parentNode.replaceChild(pad, old);
    var imgEl = document.getElementById('vpimg');
    var fg = pad.querySelector('#fg');
    var ringc = pad.querySelector('#ringc');
    var hint = document.getElementById('hint');
    var numsEl = document.getElementById('nums');
    focusOn = true;
    stage.classList.remove('sharp', 'done');
    imgEl.style.display = 'none';
    pad.classList.add('on');
    pad.querySelector('#bnum').textContent = state.quiz;
    fg.style.filter = 'blur(14px)';
    ringc.style.stroke = '#5f67e0';
    ringc.style.strokeDashoffset = RING_LEN;
    numsEl.innerHTML = ''; numsEl.classList.remove('show');
    hint.hidden = false;
    hint.textContent = '按住画面 · 把它拧到清晰';

    var p = 0, timer = null, sharp = false;
    function stop() { if (timer) { clearInterval(timer); timer = null; } }
    function reveal() {
      if (sharp) return;
      sharp = true;
      fg.style.filter = 'none';
      ringc.style.stroke = '#3fae6a'; ringc.style.strokeDashoffset = 0;
      stage.classList.add('sharp');
      hint.textContent = '看清了 · 点数字报给伊甸';
      var set = [state.quiz];
      while (set.length < 3) {
        var r = 10 + Math.floor(Math.random() * 90);
        if (set.indexOf(r) < 0) set.push(r);
      }
      set.sort(function () { return Math.random() - 0.5; });
      set.forEach(function (n) {
        var b = document.createElement('button');
        b.textContent = n;
        b.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
        b.addEventListener('click', function () {
          if (stage.classList.contains('done')) return;
          if (n === state.quiz) {
            stage.classList.add('done');
            b.classList.add('right');
            hint.textContent = '已上报 ✓ 视力正常';
            setTimeout(function () { go(cur.focus.ok); }, 700);
          } else {
            go(cur.focus.no);
          }
        });
        numsEl.appendChild(b);
      });
      numsEl.classList.add('show');
    }
    function onDown(e) {
      e.preventDefault(); audio(); stop();
      timer = setInterval(function () {
        p = Math.min(1, p + 0.075);
        fg.style.filter = 'blur(' + (14 * (1 - p)).toFixed(2) + 'px)';
        ringc.style.strokeDashoffset = RING_LEN * (1 - p);
        if (p >= 1) { stop(); reveal(); }
        else if (p > 0.08) hint.textContent = '再按住一会儿…';
      }, 70);
    }
    function onUp() { stop(); }
    pad.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    focusCleanup = function () {
      stop();
      pad.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    };
  }
  function stopFocus() {
    if (focusCleanup) { focusCleanup(); focusCleanup = null; }
    if (!focusOn) return;
    focusOn = false;
    document.getElementById('stage').classList.remove('sharp', 'done');
    document.getElementById('focuspad').classList.remove('on');
    document.getElementById('vpimg').style.display = '';
    document.getElementById('nums').innerHTML = '';
    document.getElementById('nums').classList.remove('show');
    document.getElementById('hint').hidden = true;
  }

  function rebuildFeed() {
    $view.innerHTML = '';
    tailEl = null;
    var feedEl = el('div');
    $view.appendChild(feedEl);
    state.feed.forEach(function (id) {
      var n = D.nodes[id];
      if (n) feedEl.appendChild(blockNode(n, false));
    });
    renderTail();
  }

  function resolve(id) {
    var n = D.nodes[id], i = 0;
    while (n && n.dispatch && i < 8) {
      var key = n.dispatch === 'phase' ? (state.slice ? state.slice.phase : 'default') : 'default';
      var t = n.to && (n.to[key] || n.to['default']);
      n = t ? D.nodes[t] : null;
      i++;
    }
    return n;
  }
  function idOf(node) {
    var k = Object.keys(D.nodes).filter(function (i) { return D.nodes[i] === node; });
    return k[0];
  }

  function go(id) {
    var node = resolve(id);
    if (!node) return;
    applyNode(node, state);
    state.node = D.nodes[id] && node !== D.nodes[id] ? idOf(node) : id;
    if (node.focus) state.quiz = 10 + Math.floor(Math.random() * 90);
    state.feed.push(state.node);
    var wasLog = state.tab === 'log';
    state.tab = 'log';
    save();
    applyTheme();
    renderTabs();
    if (wasLog && $view.firstChild) {
      rebuildFeed();
    } else {
      render();
      return;
    }
    $view.scrollTop = $view.scrollHeight;
    if (node.sfx) playSfx(node.sfx);
    if (node.ask) openAsk();
  }

  function renderMap() {
    var atShip = !state.world || state.world === '舰内';
    (D.map || []).forEach(function (m) {
      var here = atShip ? !!m.here : (m.name === state.world);
      var r = el('div', 'row' + (m.locked ? ' locked' : '') + (here ? ' here' : ''));
      r.appendChild(el('b', null, esc(sub(m.name))));
      r.appendChild(el('div', 'desc', esc(sub(m.desc || ''))));
      if (here) r.appendChild(el('div', 'desc', '（你在这里）'));
      $view.appendChild(r);
    });
    $view.appendChild(el('div', 'note', '原型版：地图只写到第一章。'));
  }

  function renderHour() {
    $view.appendChild(el('div', 'countdown', state.day > 0 ? state.day + ' 天' : '— —'));
    $view.appendChild(el('div', 'countdown-label', '剩余有效时间 · 舱号 EDEN/' + state.pod));
    $view.appendChild(el('div', 'quote',
      '甲方：伊甸联合体<br>乙方：{名字}<br>标的：全部剩余生命时间<br>' +
      '余额已冻结，不可充值，不可转让，不可退货。<br>处置预案：已预扣。'
      .replace(/\{名字\}/g, state.char ? state.char.name : '你')));
    if (state.flags['怀疑伊甸']) {
      $view.appendChild(el('div', 'note', '你开始留意这只 AI 的每一句「已排除故障」。'));
    }
    $view.appendChild(el('div', 'note', '天数只在剧情推进时变化——这一版先讲故事，不跑真实时间。'));
  }

  function renderBag() {
    if (!state.items.length) { $view.appendChild(el('div', 'empty', '背包是空的。东西都在箱子里了。')); return; }
    state.items.forEach(function (name, i) {
      var it = D.items[name] || { icon: '📦', desc: '' };
      var r = el('div', 'row');
      r.appendChild(el('b', null, it.icon + ' ' + esc(sub(name))));
      if (it.desc) r.appendChild(el('div', 'desc', esc(sub(it.desc))));
      var mv = el('button', 'movebtn', '移入箱子');
      mv.onclick = function () {
        state.items.splice(i, 1);
        if (state.box.indexOf(name) < 0) state.box.push(name);
        save(); render();
      };
      r.appendChild(mv);
      $view.appendChild(r);
    });
  }

  function renderBox() {
    var got = [];
    (state.collect || []).forEach(function (n) { if (got.indexOf(n) < 0) got.push(n); });
    (state.box || []).forEach(function (n) { if (got.indexOf(n) < 0) got.push(n); });
    if (!got.length) { $view.appendChild(el('div', 'empty', '箱子是空的。')); return; }
    got.forEach(function (name) {
      var c = (D.collect && D.collect[name]) || (D.items && D.items[name]) || { icon: '📦', desc: '' };
      var r = el('div', 'row');
      r.appendChild(el('b', null, (c.icon || '📦') + ' ' + esc(sub(name))));
      if (c.desc) r.appendChild(el('div', 'desc', esc(sub(c.desc))));
      $view.appendChild(r);
    });
  }

  function reset() {
    if (!confirm('重新开始？这会清掉本机的存档（开场档案、背包、箱子、天数都归零，舱号会换一个新的）。')) return;
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }

  function applyTheme() {
    var w = (D.worlds || {})[state.world] || {};
    var th = w.theme || {};
    Object.keys(th).forEach(function (k) { document.documentElement.style.setProperty(k, th[k]); });
    ['--bg','--shell','--card','--chip','--chip-press','--text','--dim','--line','--accent'].forEach(function (k) {
      if (!th[k]) {
        var v = getComputedStyle(document.createElement('div')); /* noop guard */
      }
    });
    var img = PROTO_IMGS[w.img] || PROTO_IMGS['space.svg'] || '';
    var vi = document.getElementById('vpimg'); if (vi) vi.src = img;
    var ti = document.getElementById('vptitle'); if (ti) ti.textContent = w.label || '太空舱 · 外部视野';
    document.getElementById('podchip').innerHTML = 'EDEN/' + esc(state.pod) + ' · <span id="podstatus">' + esc(sub(state.status)) + '</span>';
  }

  function render() {
    applyTheme();
    renderTabs();
    if (state.tab === 'log') {
      rebuildFeed();
      $view.scrollTop = $view.scrollHeight;
    } else {
      tailEl = null;
      stopFocus();
      $view.innerHTML = '';
      if (state.tab === 'map') renderMap();
      else if (state.tab === 'hour') renderHour();
      else if (state.tab === 'bag') renderBag();
      else if (state.tab === 'box') renderBox();
      $view.scrollTop = 0;
    }
  }

  /* ===== 复诵档案 ===== */
  var askEl = document.getElementById('ask');
  function openAsk() {
    if (state.char) return;
    askEl.hidden = false;
    document.body.classList.add('locked');
    document.getElementById('aok').onclick = function () {
      var nm = (document.getElementById('aname').value || '').trim() || ('EDEN/' + state.pod);
      var sx = (document.getElementById('asex').value || '').trim() || '未登记';
      var txt = (document.getElementById('aage').value || '').trim();
      var ag = /^\d{1,3}$/.test(txt) ? parseInt(txt, 10) : NaN;
      if (!(ag >= 1 && ag < AVG_LIFE)) {
        document.getElementById('aerr').textContent = '伊甸没能识别这个年龄——请填写 1 到 ' + (AVG_LIFE - 1) + ' 之间的数字。';
        return;
      }
      state.char = { name: nm, sex: sx, age: ag };
      state.years = AVG_LIFE - ag;
      state.day = Math.max(1, Math.round((AVG_LIFE - ag) / 7));
      save();
      askEl.hidden = true;
      document.body.classList.remove('locked');
      var t = D.nodes[state.node];
      if (t && t.ask && t.next) go(t.next); else render();
    };
  }

  /* ===== 黑场开场 ===== */
  var introEl = document.getElementById('intro');
  function playIntro(done) {
    var it = introEl.querySelector('.ititle');
    var timers = [], finished = false;
    introEl.hidden = false;
    document.body.classList.add('locked');
    function fin() {
      if (finished) return;
      finished = true;
      timers.forEach(clearTimeout); timers = [];
      it.classList.remove('on');
      introEl.classList.add('out');
      setTimeout(function () {
        introEl.hidden = true;
        introEl.classList.remove('out');
        document.body.classList.remove('locked');
        introEl.removeEventListener('click', fin);
        done();
      }, 700);
    }
    introEl.addEventListener('click', fin);
    timers.push(setTimeout(function () { it.classList.add('on'); }, 500));
    timers.push(setTimeout(function () { it.classList.remove('on'); }, 3000));
    timers.push(setTimeout(fin, 4900));
  }

  document.getElementById('tabreset').onclick = reset;
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || (t.closest && t.closest('.block')))) return;
    e.preventDefault();
  });

  if (state.char) {
    render();
  } else {
    playIntro(function () {
      render();
      var n = D.nodes[state.node];
      if (n && n.sfx) playSfx(n.sfx);
    });
  }
})();
</script>
</body>
</html>
