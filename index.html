<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDEN</title>
<meta name="theme-color" content="#e8eaf2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section class="status-card" id="statuscard">
    <div class="viewport" id="viewport">
      <img id="vpimg" src="space.svg" alt="外部视野">
      <div class="status-title" id="vptitle">太空舱 · 外部视野</div>
    </div>
  </section>

  <nav class="tabbar" id="tabbar">
    <div class="tabtools">
      <a class="tbtn" href="dev.html" title="编辑页">✎</a>
      <button class="tbtn" id="tabreset" title="重新开始">∞</button>
      <button class="tbtn" id="tabfx" title="输出方式">▸▸</button>
    </div>
    <div id="fxpanel" hidden>
      <div class="fx-row"><span>输出方式</span>
        <div class="seg" id="fxmode">
          <button data-v="none">全出</button>
          <button data-v="line">逐行</button>
          <button data-v="char">逐字</button>
        </div>
      </div>
      <div class="fx-row"><span>速度</span>
        <div class="seg" id="fxspeed">
          <button data-v="slow">慢</button>
          <button data-v="mid">中</button>
          <button data-v="fast">快</button>
        </div>
      </div>
      <div class="fx-tip">逐字=一个字一个字出。打字途中点一下屏幕，立刻全部显示完。</div>
    </div>
  </nav>

  <main id="view"></main>
</div>

<!-- 黑场大字卡：开场「伊甸」与进入切片世界共用。字直接蹦出（不缩放不淡入），停两秒再渐隐 -->
<div id="intro" hidden>
  <div class="ititle">伊甸</div>
</div>

<!-- 复诵档案：姓名 / 性别 / 年龄（只有年龄要求数字，年龄参与余额计算） -->
<div id="ask" hidden>
  <div class="cu">
    <div class="cu-k">伊甸 · 复诵</div>
    <h2>请向我复诵您的<br>姓名、性别、年龄。</h2>
    <p class="cu-note">——其中只有年龄要求是数字，它会进入之后的折算。</p>
    <input id="aname" maxlength="12" placeholder="姓名（留空 = 填编号）" autocomplete="off">
    <input id="asex" maxlength="6" placeholder="性别" autocomplete="off">
    <input id="aage" inputmode="numeric" placeholder="年龄（数字）" autocomplete="off">
    <div id="aerr"></div>
    <button class="btn" id="aok">复 诵</button>
  </div>
</div>

<div id="pinbanner">
  <div class="pb">
    <img id="pbimg" src="space.svg" alt="">
    <div class="pb-bar">
      <span class="pb-brand">EDEN / <span id="podnum">000</span></span>
      <span class="pb-status" id="pincabin">正常运行</span>
      <button id="pinreset" title="重新开始">∞</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
