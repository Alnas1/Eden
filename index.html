<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDEN</title>
<meta name="theme-color" content="#e8eaf2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section class="status-card" id="statuscard">
    <div class="status-head">
      <span>CABIN STATUS</span>
      <button id="resetbtn" title="重新开始">∞</button>
    </div>
    <div class="viewport" id="viewport">
      <img src="space.svg" alt="外部视野">
      <div class="status-title">太空舱 · 外部视野</div>
    </div>
    <div class="status-foot">
      <span>舱室状态</span>
      <b id="cabinstatus">正常运行</b>
    </div>
  </section>

  <nav class="tabbar" id="tabbar"></nav>

  <main id="view"></main>
</div>

<div id="pinbanner">
  <div class="pb">
    <img src="space.svg" alt="">
    <div class="pb-bar">
      <span class="pb-brand">EDEN / <span id="podnum">000</span></span>
      <span class="pb-status" id="pincabin">正常运行</span>
      <button id="pinreset" title="重新开始">∞</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
